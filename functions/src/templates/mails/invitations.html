<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #333333;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="width: 100%; margin: 0; padding: 0; background-color: #f5f5f5"
    >
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 10px;
              overflow: hidden;
            "
          >
            <!-- Header -->
            <tr>
              <td
                align="center"
                style="padding: 28px 30px; background-color: #222222"
              >
                <img
                  src="https://raw.githubusercontent.com/ruxailab/RUXAILAB/develop/src/assets/logo_full_white.png"
                  alt="RUXAILAB"
                  width="180"
                  style="
                    display: block;
                    width: 180px;
                    max-width: 100%;
                    height: auto;
                    border: 0;
                  "
                />
              </td>
            </tr>

            <!-- Main content -->
            <tr>
              <td style="padding: 42px 45px 38px; color: #333333">
                <!-- Title -->
                <h1
                  style="
                    margin: 0 0 14px;
                    font-size: 26px;
                    line-height: 1.3;
                    font-weight: 700;
                    color: #222222;
                  "
                >
                  {{title}}
                </h1>

                <!-- Description -->
                <p
                  style="
                    margin: 0 0 32px;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #555555;
                  "
                >
                  {{description}}
                </p>

                <!-- Study information -->
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="
                    width: 100%;
                    margin: 0 0 28px;
                    background-color: #f8f8f8;
                    border-radius: 8px;
                  "
                >
                  <tr>
                    <td style="padding: 24px 26px">
                      <p
                        style="
                          margin: 0 0 8px;
                          font-size: 11px;
                          line-height: 1.4;
                          font-weight: 700;
                          text-transform: uppercase;
                          letter-spacing: 0.8px;
                          color: #888888;
                        "
                      >
                        Study
                      </p>

                      <p
                        style="
                          margin: 0 0 12px;
                          font-size: 20px;
                          line-height: 1.4;
                          font-weight: 700;
                          color: #222222;
                        "
                      >
                        {{testTitle}}
                      </p>

                      <p
                        style="
                          margin: 0;
                          font-size: 14px;
                          line-height: 1.6;
                          color: #666666;
                        "
                      >
                        {{testDescription}}
                      </p>
                    </td>
                  </tr>
                </table>

                <!-- Organizer -->
                <p
                  style="
                    margin: 0 0 28px;
                    font-size: 14px;
                    line-height: 1.5;
                    color: #666666;
                  "
                >
                  Organized by
                  <strong style="color: #333333">{{adminName}}</strong>
                </p>

                <!-- Personal message -->
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="width: 100%; margin: 0 0 32px"
                >
                  <tr>
                    <td
                      style="
                        padding: 18px 20px;
                        background-color: #fafafa;
                        border-left: 3px solid #4caf50;
                      "
                    >
                      <p
                        style="
                          margin: 0 0 8px;
                          font-size: 12px;
                          line-height: 1.4;
                          font-weight: 700;
                          text-transform: uppercase;
                          letter-spacing: 0.5px;
                          color: #777777;
                        "
                      >
                        A message from the organizer
                      </p>

                      <p
                        style="
                          margin: 0;
                          font-size: 14px;
                          line-height: 1.6;
                          color: #555555;
                        "
                      >
                        {{message}}
                      </p>
                    </td>
                  </tr>
                </table>

                <!-- CTA -->
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td align="center">
                      <a
                        href="{{invitationLink}}"
                        style="
                          display: inline-block;
                          padding: 14px 32px;
                          background-color: #1976d2;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 6px;
                          font-size: 15px;
                          font-weight: 700;
                          line-height: 1.2;
                        "
                      >
                        Access RUXAILAB
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                align="center"
                style="
                  padding: 26px 35px;
                  background-color: #f7f7f7;
                  border-top: 1px solid #eeeeee;
                "
              >
                <p
                  style="
                    margin: 0 0 10px;
                    font-size: 13px;
                    line-height: 1.5;
                    color: #666666;
                  "
                >
                  Need help? Contact
                  <a
                    href="mailto:{{adminEmail}}"
                    style="color: #4caf50; text-decoration: none"
                  >
                    {{adminEmail}}
                  </a>
                </p>

                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    line-height: 1.5;
                    color: #999999;
                  "
                >
                  &copy; 2026 RUXAILAB. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
