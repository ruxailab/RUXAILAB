<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{title}}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    "
  >
    <table
      align="center"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        max-width: 600px;
        background: #ffffff;
        border-radius: 8px;
        overflow: hidden;
      "
    >
      <thead>
        <tr>
          <th
            scope="col"
            style="
              display: none;
              visibility: hidden;
              mso-hide: all;
              font-size: 0;
              line-height: 0;
            "
          >
            Message
          </th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td style="text-align: center; padding: 20px; background: #222">
            <img
              src="https://raw.githubusercontent.com/ruxailab/RUXAILAB/develop/src/assets/logo_full_white.png"
              alt="RUXAILAB"
              style="display: block; margin: 0 auto; max-width: 180px"
            />
          </td>
        </tr>

        <tr>
          <td
            style="
              padding: 30px;
              color: #333;
              font-size: 16px;
              line-height: 1.6;
            "
          >
            <h2 style="margin-top: 0">{{title}}</h2>

            <p>{{message}}</p>

            <p style="margin-top: 30px; color: #666; font-size: 14px">
              Sent by:
              <strong>{{author}}</strong>
            </p>
          </td>
        </tr>

        <tr>
          <td
            style="
              background: #f0f0f0;
              padding: 20px;
              text-align: center;
              font-size: 12px;
              color: #888;
            "
          >
            © 2026 RUXAILAB - All rights reserved.
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
