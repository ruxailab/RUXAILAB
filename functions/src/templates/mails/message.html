<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{title}}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    "
  >
    <table
      align="center"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        width: 100%;
        max-width: 600px;
        margin: 30px auto;
        background: #ffffff;
        border-radius: 10px;
        overflow: hidden;
      "
    >
      <thead>
        <tr>
          <th
            scope="col"
            style="
              display: none;
              visibility: hidden;
              mso-hide: all;
              font-size: 0;
              line-height: 0;
            "
          >
            RUXAILAB Session Message
          </th>
        </tr>
      </thead>

      <tbody>
        <!-- Logo -->
        <tr>
          <td style="text-align: center; padding: 24px; background: #222222">
            <img
              src="https://raw.githubusercontent.com/ruxailab/RUXAILAB/develop/src/assets/logo_full_white.png"
              alt="RUXAILAB"
              style="
                display: block;
                margin: 0 auto;
                max-width: 180px;
                height: auto;
              "
            />
          </td>
        </tr>

        <!-- Main content -->
        <tr>
          <td
            style="
              padding: 40px 36px 20px;
              color: #333333;
              font-size: 16px;
              line-height: 1.6;
            "
          >
            <p style="margin: 0 0 10px; font-size: 14px; color: #777777">
              RUXAILAB
            </p>

            <h1
              style="
                margin: 0 0 18px;
                font-size: 24px;
                line-height: 1.3;
                color: #222222;
              "
            >
              {{title}}
            </h1>

            <p style="margin: 0 0 28px; color: #555555">{{message}}</p>

            <!-- Author -->
            <div style="margin-bottom: 28px">
              <p
                style="
                  margin: 0 0 10px;
                  font-size: 12px;
                  font-weight: bold;
                  text-transform: uppercase;
                  letter-spacing: 0.5px;
                  color: #888888;
                "
              >
                Sent by
              </p>

              <p style="margin: 0; font-size: 14px; color: #555555">
                {{author}}
              </p>
            </div>
          </td>
        </tr>

        <!-- Action -->
        <tr>
          <td style="padding: 12px 36px 40px; text-align: center">
            <a
              href="{{actionLink}}"
              style="
                display: inline-block;
                padding: 14px 30px;
                background: #1976d2;
                color: #ffffff;
                text-decoration: none;
                border-radius: 6px;
                font-size: 16px;
                font-weight: bold;
              "
            >
              {{actionText}}
            </a>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td
            style="
              background: #f0f0f0;
              padding: 22px 30px;
              text-align: center;
              font-size: 12px;
              line-height: 1.5;
              color: #888888;
            "
          >
            <p style="margin: 0">&copy; 2026 RUXAILAB - All rights reserved.</p>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
