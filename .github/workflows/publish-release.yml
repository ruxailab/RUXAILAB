name: Publish Release Announcement

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # BLOG
      # ---------------------------------------------------------

      - name: Checkout RUXAILAB blog
        uses: actions/checkout@v4
        with:
          repository: ruxailab/blog
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          path: blog

      - name: Create blog post
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          FILE_NAME=$(echo "$RELEASE_TAG" | tr '[:upper:]' '[:lower:]')
          FILE_PATH="blog/posts/ruxailab-${FILE_NAME}.md"
          CURRENT_DATE=$(date +'%Y-%m-%d')

          echo "Creating blog post: $FILE_PATH"

          if [ "$IS_PRERELEASE" = "true" ]; then
            SUMMARY="RUXAILAB ${RELEASE_TAG} is now available for testing. This pre-release includes the latest features, improvements, and fixes contributed by the RUXAILAB community.

          This beta is part of the RUXAILAB 3.0 release cycle. We invite the community to test the new version and help us identify issues before the final release."

            INTRO="**RUXAILAB ${RELEASE_TAG}** is now available as a pre-release. This version brings together the latest developments from the RUXAILAB community and provides an early opportunity to test the upcoming RUXAILAB 3.0."
          else
            SUMMARY="RUXAILAB ${RELEASE_TAG} is now available. This release includes the latest features, improvements, and fixes contributed by the RUXAILAB community."

            INTRO="**RUXAILAB ${RELEASE_TAG}** is now available. This release brings together the latest developments, improvements, and fixes from the RUXAILAB community."
          fi

          cat > "$FILE_PATH" <<EOF
          ---
          title: ${RELEASE_NAME}
          date: ${CURRENT_DATE}
          author: RUXAILAB
          ---

          ${SUMMARY}

          ---

          ${INTRO}

          ${RELEASE_BODY}

          ## Try It

          You can find the complete release, source code, and additional information on GitHub.

          **Release**: [${RELEASE_TAG}](${RELEASE_URL})

          ---

          Thanks to everyone who contributed to this release.
          EOF

      - name: Commit and push blog post
        working-directory: blog
        run: |
          git config user.name "RUXAILAB Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add posts/

          if git diff --cached --quiet; then
            echo "No blog changes to commit."
          else
            git commit -m "Add blog post for ${{ github.event.release.tag_name }}"
            git push
          fi

      # ---------------------------------------------------------
      # DISCORD
      # ---------------------------------------------------------

      - name: Announce release on Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            MESSAGE="🧪 **${RELEASE_NAME} is now available for testing!**

          We're preparing the next version of RUXAILAB and would love your help testing it.

          🔗 ${RELEASE_URL}"
          else
            MESSAGE="🚀 **${RELEASE_NAME} is now available!**

          A new version of RUXAILAB has been released.

          🔗 ${RELEASE_URL}"
          fi

          jq -n \
            --arg content "$MESSAGE" \
            '{content: $content}' > payload.json

          curl \
            --fail \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK"

          echo "Discord announcement sent."
