name: Monthly Milestone Creator

on:
  schedule:
    # Runs at 08:00 UTC on the 1st of each month
    # (Avoids midnight to reduce GitHub Actions cron scheduling delays)
    - cron: '0 8 1 * *'

  workflow_dispatch:
    inputs:
      month:
        description: 'Month name in English (e.g. June). Leave empty for current month.'
        required: false
        type: string
      year:
        description: 'Year (e.g. 2026). Leave empty for current year.'
        required: false
        type: string

permissions:
  contents: read    # To checkout repo and read milestone-config.yml
  issues: write     # To create/update milestones (milestones use the Issues API)

jobs:
  create-milestone:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Pin Node explicitly — ubuntu-latest's bundled Node version is not a
        # stable contract and can shift between runner image releases.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install YAML parser
        # Installed with --no-save to avoid polluting package.json / package-lock.json.
        # Version is pinned (~2.6.1 = patches only) so a new yaml release on the
        # scheduled cron run cannot silently break parsing. Bump intentionally.
        # The script has a fallback parser if this step fails.
        run: npm install --no-save yaml@~2.6.1
        continue-on-error: true

      - name: Create or Update Monthly Milestone
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INPUT_MONTH: ${{ github.event.inputs.month || '' }}
          INPUT_YEAR: ${{ github.event.inputs.year || '' }}
        with:
          script: |
            const script = require('./.github/scripts/create-monthly-milestone.js');
            await script({ github, context, core });
