name: rules🔒

# The Firestore/Storage rules suite needs the Firebase emulators, so it is not
# part of test🧪 (which runs `npm test`). Nothing in CI exercised
# firestore.rules before this, which is how a rules change could land on
# develop with the suite red. Scoped by path so the emulators only spin up for
# changes that can actually affect the rules.
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'database.rules.json'
      - 'firebase.json'
      - 'jest.rules.config.js'
      - 'tests/rules/**'
  push:
    branches: [develop]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'database.rules.json'
      - 'firebase.json'
      - 'jest.rules.config.js'
      - 'tests/rules/**'
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # The emulators are a Java process.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install Dependencies
        run: npm ci

      # `npm run test:rules` calls the firebase CLI, which is not a project
      # dependency.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Rules tests
        run: npm run test:rules
