name: Reliability

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  reliability:
    name: Reliability Tests
    runs-on: ubuntu-latest
    env:
      CI: true
      PLAYWRIGHT_REPORTER: json
      PLAYWRIGHT_JSON_OUTPUT_NAME: reliability-results.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Detect Playwright tests
        id: detect_tests
        run: |
          if [ ! -d e2e ]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "test_count=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Playwright tests detected::This repository does not contain an e2e directory yet. The Reliability workflow will skip execution. Please create tests first to validate this pipeline."
            exit 0
          fi

          test_count=$(find e2e -type f \( -name '*.spec.js' -o -name '*.spec.ts' -o -name '*.test.js' -o -name '*.test.ts' \) | wc -l | tr -d ' ')

          if [ "$test_count" -eq 0 ]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "test_count=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Playwright tests detected::This repository does not contain Playwright tests yet. The Reliability workflow will skip execution. Please create tests first to validate this pipeline."
          else
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "test_count=$test_count" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        if: steps.detect_tests.outputs.has_tests == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright reliability suite
        if: steps.detect_tests.outputs.has_tests == 'true'
        run: npm run test-playwright

      - name: Generate reliability report
        if: always()
        uses: actions/github-script@v7
        env:
          RELIABILITY_HAS_TESTS: ${{ steps.detect_tests.outputs.has_tests }}
          RELIABILITY_TEST_COUNT: ${{ steps.detect_tests.outputs.test_count }}
        with:
          script: |
            const script = require('./.github/scripts/generate_reliability_report.js');
            await script({github, context, core});

      - name: Upload reliability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-results
          path: |
            reliability-results.json
            .github/reliability_data.json
            .github/reliability_report.md

      - name: Commit updated reliability history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(reliability): update reliability control sheet'
          file_pattern: .github/reliability_data.json
