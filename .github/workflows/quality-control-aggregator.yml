name: Quality Control Aggregator

on:
  workflow_run:
    types:
      - completed
  schedule:
    # Roda as 23:00 de Seg a Sex (UTC)
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  aggregate-quality-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Token customizado caso precise commitar por cima de protecoes de branch. Senão usar padrao.
          # token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Fetch Pipeline Results
        id: fetch_results
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            let testFails = 0, secFails = 0, codeFails = 0;

            try {
              // 1. Busca as pipelines/workflows do repositório automaticamente
              const { data } = await github.rest.actions.listRepoWorkflows({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              
              const activeWorkflows = data.workflows.filter(w => w.state === 'active');
              
              // 2. Verifica se existem pipelines ativas
              if (activeWorkflows.length === 0) {
                core.info('⚠️ Nenhuma pipeline ativa encontrada no repositório.');
              } else {
                core.info(`✅ Encontradas ${activeWorkflows.length} pipelines ativas no repositório.`);
                activeWorkflows.forEach(w => core.info(`- ${w.name}`));
              }
            } catch (error) {
              core.warning(`Erro ao buscar pipelines: ${error.message}`);
            }
            
            // 3. Verifica a pipeline que engatilhou o evento usando palavras-chave
            if (eventName === 'workflow_run') {
              const triggeredBy = context.payload.workflow.name;
              const conclusion = context.payload.workflow_run.conclusion;
              
              if (conclusion === 'failure') {
                const nameLower = triggeredBy.toLowerCase();
                
                // Mapeamento automático em vez de nomes cravados (hardcoded)
                if (nameLower.includes('test')) testFails = 1;
                else if (nameLower.includes('gitguardian') || nameLower.includes('security')) secFails = 1;
                else if (nameLower.includes('sonar') || nameLower.includes('code issue') || nameLower.includes('code smell') || nameLower.includes('pr check') || nameLower.includes('lint')) codeFails = 1;
                else core.info(`Pipeline '${triggeredBy}' falhou, mas não foi mapeada para as categorias de QC padroes.`);
              }
            }
            
            core.exportVariable('TEST_ERRORS', testFails);
            core.exportVariable('SECURITY_ISSUES', secFails);
            core.exportVariable('CODE_SMELLS', codeFails);

      - name: Execute QC Aggregator Script
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/generate_qc_report.js');
            await script({github, context, core});
            
      - name: Commit Updated Check Sheet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(qc): Update Daily Quality Control Check Sheet"
          file_pattern: .github/quality_control_data.json
